name: Verificar

on:
  push:
    branches: [main, 'desarrollo/**']
  pull_request:

jobs:
  base-de-datos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Migraciones desde cero y pruebas de acceso, compras, evaluación, talleres y concurrencia
        run: |
          set -o pipefail
          ./scripts/probar-db.sh 2>&1 | tee probar-db.log
      - name: Señalar fallas de base de datos
        if: failure()
        run: grep -A6 -E "FALLA|ERROR|error:" probar-db.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done

  aplicacion:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: clave-anonima-solo-para-compilar
      NEXT_PUBLIC_URL_SITIO: http://localhost:3000
      SUPABASE_SERVICE_ROLE_KEY: clave-de-servicio-solo-para-compilar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run tipos
      - run: npm run probar
      - name: Compilar
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Mostrar errores de compilación
        if: failure()
        run: grep -iE "error|failed|cannot|unexpected" build.log | grep -v "^ *at " | head -10 | while IFS= read -r l; do echo "::error::$l"; done

  capturas:
    # Levanta Supabase con datos de ejemplo, inicia el sitio y guarda capturas en la rama "capturas".
    if: github.event_name == 'push'
    needs: [base-de-datos, aplicacion]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Supabase local
        run: |
          npx supabase init --force >/dev/null
          # Segundo factor TOTP habilitado en Auth local (Fase 6A); la política de la academia sigue apagada.
          sed -i '/^\[auth.mfa.totp\]/,/^$/ s/= false/= true/' supabase/config.toml
          npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
          npx supabase status -o env > supabase.env
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f tests/visual/demo.sql
          set -a; . ./supabase.env; set +a
          ./tests/visual/campus.sh
      - name: Compilar e iniciar
        run: |
          set -a; . ./supabase.env; set +a
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export NEXT_PUBLIC_URL_SITIO=http://localhost:3000
          export PROCESOS_CLAVE=clave-de-procesos-solo-para-ci-0123456789
          # Entorno de pruebas: reproductor de video simulado (nunca en producción; ver src/config/validacion.ts).
          export APP_ENTORNO=pruebas VIDEO_PROVEEDOR=simulado VIDEO_SIMULADO_SECRETO=secreto-de-video-simulado-solo-para-pruebas
          npm run build
          (npm start > servidor.log 2>&1 &)
          npx wait-on -t 60000 http://localhost:3000
      - name: Capturas
        run: |
          npx playwright install --with-deps chromium
          set -o pipefail
          mkdir -p capturas
          set -a; . ./campus.env; set +a
          fallo=0
          env -u CORREO -u CLAVE npm run -s capturas -- / /cursos /cursos/demo-montessori-en-casa /talleres /talleres/demo-taller-ambiente /la-maestra /contacto /ingresar /registro $RUTAS_VERIFICAR 2>&1 | tee capturas/informe.txt || fallo=1
          DESCARGAR="$CERTIFICADO" npm run -s capturas -- $RUTAS_CAMPUS 2>&1 | tee -a capturas/informe.txt || fallo=1
          echo "--- recorrido del campus" | tee -a capturas/informe.txt
          node scripts/recorrido-campus.mjs 2>&1 | tee -a capturas/informe.txt || fallo=1
          echo "--- integraciones simuladas: video, correo y secretos" | tee -a capturas/informe.txt
          (set -a; . ./supabase.env; set +a; PROCESOS_CLAVE=clave-de-procesos-solo-para-ci-0123456789 VIDEO_SIMULADO_SECRETO=secreto-de-video-simulado-solo-para-pruebas node scripts/recorrido-integraciones.mjs) 2>&1 | tee -a capturas/informe.txt || fallo=1
          echo "--- panel" | tee -a capturas/informe.txt
          CORREO="$ADMIN_CORREO" CLAVE="$ADMIN_CLAVE" npm run -s capturas -- $RUTAS_ADMIN 2>&1 | tee -a capturas/informe.txt || fallo=1
          node scripts/recorrido-admin.mjs 2>&1 | tee -a capturas/informe.txt || fallo=1
          echo "--- cursos en el panel" | tee -a capturas/informe.txt
          node scripts/recorrido-cursos.mjs 2>&1 | tee -a capturas/informe.txt || fallo=1
          echo "--- talleres en el panel, el sitio y el campus" | tee -a capturas/informe.txt
          PROCESOS_CLAVE=clave-de-procesos-solo-para-ci-0123456789 node scripts/recorrido-talleres.mjs 2>&1 | tee -a capturas/informe.txt || fallo=1
          echo "--- modalidad de evaluación: formativa y sumativa" | tee -a capturas/informe.txt
          (set -a; . ./supabase.env; set +a; node scripts/recorrido-evaluaciones.mjs) 2>&1 | tee -a capturas/informe.txt || fallo=1
          echo "--- vencimientos de cursos" | tee -a capturas/informe.txt
          node scripts/recorrido-vencimientos.mjs 2>&1 | tee -a capturas/informe.txt || fallo=1
          echo "--- períodos de acceso: renovación, certificado vencido, becas y talleres apagados" | tee -a capturas/informe.txt
          (set -a; . ./supabase.env; set +a; node scripts/recorrido-renovaciones.mjs) 2>&1 | tee -a capturas/informe.txt || fallo=1
          echo "--- panel de cursos: duplicar, vista previa, orden, revisiones y bloqueos" | tee -a capturas/informe.txt
          node scripts/recorrido-panel-cursos.mjs 2>&1 | tee -a capturas/informe.txt || fallo=1
          echo "--- perfil y presentación de la maestra" | tee -a capturas/informe.txt
          (set -a; . ./supabase.env; set +a; node scripts/recorrido-perfil.mjs) 2>&1 | tee -a capturas/informe.txt || fallo=1
          echo "--- acciones protegidas con la sesión de la alumna" | tee -a capturas/informe.txt
          node scripts/acciones-protegidas.mjs 2>&1 | tee -a capturas/informe.txt || fallo=1
          echo "--- acciones sensibles: alumna, visitante, API y almacenamiento" | tee -a capturas/informe.txt
          (set -a; . ./supabase.env; set +a; node scripts/acciones-sensibles.mjs) 2>&1 | tee -a capturas/informe.txt || fallo=1
          echo "--- seguridad: segundo factor, verificación reforzada y recuperación" | tee -a capturas/informe.txt
          (set -a; . ./supabase.env; set +a; node scripts/recorrido-mfa.mjs) 2>&1 | tee -a capturas/informe.txt || fallo=1
          echo "--- hidratación: cargas repetidas en escritorio y celular" | tee -a capturas/informe.txt
          node scripts/recorrido-hidratacion.mjs 2>&1 | tee -a capturas/informe.txt || fallo=1
          echo "--- aislamiento entre personas: admin, alumna A, alumna B y visitante" | tee -a capturas/informe.txt
          (set -a; . ./supabase.env; set +a; node scripts/recorrido-aislamiento.mjs) 2>&1 | tee -a capturas/informe.txt || fallo=1
          exit $fallo
      - name: Señalar problemas de capturas
        if: failure()
        run: grep -E "DESBORDE|error en consola|FALLA|^[45][0-9][0-9] |→ /ingresar" capturas/informe.txt | head -20 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Guardar en la rama capturas
        if: always()
        run: |
          mkdir -p /tmp/salida && cp -r capturas/. /tmp/salida/ 2>/dev/null || true
          # main publica en «capturas»; las ramas de desarrollo, en «capturas-<rama>» (no pisan las de main).
          destino=capturas; [ "${GITHUB_REF_NAME}" != main ] && destino="capturas-${GITHUB_REF_NAME//\//-}"
          cd /tmp/salida && git init -q && git checkout -q -b "$destino"
          git config user.name "verificacion-albor" && git config user.email "verificacion@albor.invalid"
          git add -A && git commit -qm "Capturas de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$destino"
